[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckks-lite"
version = "0.1.0"
description = "A tiny, readable CKKS homomorphic encryption library for learning, built on NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ckks-lite contributors" }]
keywords = [
    "ckks",
    "homomorphic-encryption",
    "privacy-preserving",
    "cryptography",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/WatchRhine/ckks-lite"
Repository = "https://github.com/WatchRhine/ckks-lite"
Issues = "https://github.com/WatchRhine/ckks-lite/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ckks_lite = ["_bin/*.exe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
